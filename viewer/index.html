<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pilly’s game</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #121916;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        margin: 0;
        color: #e7f3e9;
        background: #121916;
        font:
          18px system-ui,
          sans-serif;
      }
      #status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <p id="status" role="status">Waiting for Pilly’s game…</p>
    <script src="/pilly-viewer.js" defer></script>
  </body>
</html>
